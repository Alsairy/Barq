apiVersion: v1
kind: Secret
metadata:
  name: barq-secrets
  namespace: barq-system
type: Opaque
stringData:
  database-password: "${DATABASE_PASSWORD}"
  jwt-secret: "${JWT_SECRET_KEY}"
  redis-password: "${REDIS_PASSWORD}"
  database-connection: "Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DATABASE_PASSWORD};TrustServerCertificate=true;"
---
apiVersion: v1
kind: Secret
metadata:
  name: barq-tls-secret
  namespace: barq-system
type: kubernetes.io/tls
stringData:
  tls.crt: "${TLS_CERTIFICATE}"
  tls.key: "${TLS_PRIVATE_KEY}"
